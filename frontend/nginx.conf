# Редирект с HTTP (80) на безопасный HTTPS (443)
server {
    listen 80;
    server_name zakupki.asiapartners.kz www.zakupki.asiapartners.kz _;

    # Путь для проверки Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной HTTPS сервер (443)
server {
    listen 443 ssl http2;
    server_name zakupki.asiapartners.kz www.zakupki.asiapartners.kz;

    # SSL Сертификаты Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/zakupki.asiapartners.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zakupki.asiapartners.kz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие файлов (gzip) для быстрой загрузки сайта
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Проксирование API запросов на FastAPI бэкенд
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Правило для React Router (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических ассетов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-cache, must-revalidate";
        try_files $uri =404;
    }
}
