version: "3.9"

services:
  # ==============================
  # PostgreSQL (Боевая база)
  # ==============================
  db:
    image: postgres:16-alpine
    container_name: asia_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asia_procurement}
      POSTGRES_USER: ${POSTGRES_USER:-asia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asia_super_secret_pass}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asia} -d ${POSTGRES_DB:-asia_procurement}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================
  # Redis (Боевой кэш)
  # ==============================
  redis:
    image: redis:7-alpine
    container_name: asia_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================
  # FastAPI Backend (Боевой)
  # ==============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asia_backend_prod
    restart: always
    # Перезаписываем команду запуска без флага --reload (для скорости)
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    env_file:
      - .env
    volumes:
      - uploads_data_prod:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==============================
  # React Frontend + Nginx (Боевой)
  # ==============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asia_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  redis_data_prod:
  uploads_data_prod:
