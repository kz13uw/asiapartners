version: "3.9"

services:
  # ==============================
  # PostgreSQL (Боевая база)
  # ==============================
  db:
    image: postgres:16-alpine
    container_name: asia_db_prod
    restart: always
    environment:
      POSTGRES_DB: asia_procurement
      POSTGRES_USER: asia
      POSTGRES_PASSWORD: asia_super_secret_pass
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asia -d asia_procurement"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================
  # Redis (Боевой кэш)
  # ==============================
  redis:
    image: redis:7-alpine
    container_name: asia_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================
  # NCANode (Верификация ЭЦП НУЦ РК)
  # ==============================
  ncanode:
    image: ncanode/ncanode:latest
    container_name: asia_ncanode_prod
    restart: always
    ports:
      - "14579:14579"

  # ==============================
  # FastAPI Backend (Боевой)
  # ==============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asia_backend_prod
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      DATABASE_URL: postgresql+asyncpg://asia:asia_super_secret_pass@db:5432/asia_procurement
      DATABASE_URL_SYNC: postgresql://asia:asia_super_secret_pass@db:5432/asia_procurement
      REDIS_URL: redis://redis:6379/0
      USE_SQLITE: "false"
      ADMIN_PASSWORD: "Asia@Procurement2025!"
      SECRET_KEY: "asia_partners_super_secure_jwt_secret_key_prod_2026"
      NCANODE_URL: "http://ncanode:14579"
    volumes:
      - uploads_data_prod:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ncanode:
        condition: service_started


  # ==============================
  # React Frontend + Nginx (Боевой)
  # ==============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asia_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  redis_data_prod:
  uploads_data_prod:
